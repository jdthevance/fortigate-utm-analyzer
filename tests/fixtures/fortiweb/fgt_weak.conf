#config-version=FGT100F-7.4.5-FW-build2702-240909:opmode=0:vdom=0
#Sample FortiGate configuration for the FortiWeb cross-check tests. Not a
#real backup. It deliberately contains common mistakes.
config system interface
    edit "wan1"
        set ip 203.0.113.2 255.255.255.0
        set role wan
    next
    edit "waf-dmz"
        set ip 10.10.10.1 255.255.255.0
        set allowaccess ping
        set role dmz
    next
    edit "web-servers"
        set ip 10.20.20.1 255.255.255.0
        set role dmz
    next
    edit "internal"
        set ip 10.1.0.1 255.255.0.0
        set role lan
    next
    edit "mgmt"
        set ip 192.168.100.1 255.255.255.0
    next
end
config router static
    edit 1
        set gateway 203.0.113.1
        set device "wan1"
    next
end
config system ntp
    set ntpsync enable
    set type fortiguard
end
config log fortianalyzer setting
    set status enable
    set server "192.168.100.50"
end
config firewall address
    edit "all"
        set subnet 0.0.0.0 0.0.0.0
    next
    edit "LAN"
        set subnet 10.1.0.0 255.255.0.0
    next
    edit "Web-Servers"
        set subnet 10.20.20.0 255.255.255.0
    next
end
config firewall vip
    edit "VIP-Shop"
        set extip 203.0.113.10
        set extintf "wan1"
        set portforward enable
        set extport 443
        set mappedport 443
        set mappedip "10.10.10.10"
    next
    edit "VIP-Shop-HTTP"
        set extip 203.0.113.10
        set extintf "wan1"
        set portforward enable
        set extport 80
        set mappedport 80
        set mappedip "10.10.10.10"
    next
    edit "VIP-Portal"
        set extip 203.0.113.11
        set extintf "wan1"
        set mappedip "10.10.10.11"
    next
    edit "VIP-WAF-Admin"
        set extip 203.0.113.12
        set extintf "wan1"
        set portforward enable
        set extport 8443
        set mappedport 443
        set mappedip "10.10.10.5"
    next
    edit "VIP-Legacy-API"
        set extip 203.0.113.13
        set extintf "wan1"
        set portforward enable
        set extport 443
        set mappedport 80
        set mappedip "10.20.20.31"
    next
end
config firewall policy
    edit 1
        set name "Shop via WAF"
        set srcintf "wan1"
        set dstintf "waf-dmz"
        set srcaddr "all"
        set dstaddr "VIP-Shop" "VIP-Shop-HTTP"
        set action accept
        set schedule "always"
        set service "HTTPS" "HTTP"
        set nat enable
        set logtraffic all
    next
    edit 2
        set name "Portal via WAF"
        set srcintf "wan1"
        set dstintf "waf-dmz"
        set srcaddr "all"
        set dstaddr "VIP-Portal"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic disable
    next
    edit 3
        set name "WAF admin from outside"
        set srcintf "wan1"
        set dstintf "waf-dmz"
        set srcaddr "all"
        set dstaddr "VIP-WAF-Admin"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
    next
    edit 4
        set name "Legacy API direct"
        set srcintf "wan1"
        set dstintf "web-servers"
        set srcaddr "all"
        set dstaddr "VIP-Legacy-API"
        set action accept
        set schedule "always"
        set service "HTTP"
        set ips-sensor "default"
        set logtraffic all
    next
    edit 5
        set name "Staff to web servers"
        set srcintf "internal"
        set dstintf "web-servers"
        set srcaddr "LAN"
        set dstaddr "Web-Servers"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS"
        set logtraffic all
    next
end
