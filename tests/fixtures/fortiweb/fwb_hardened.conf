#config-version=FVVM00-8.00-FW-build0123-250101:opmode=0:vdom=0
#Sample hardened FortiWeb 8.0 configuration for tests (two-arm reverse proxy
#behind a FortiGate). Built from the FortiWeb 8.0 CLI Reference; not a real backup.
config system global
    set hostname "FWB-DMZ-02"
    set admintimeout 10
    set admin-lockout-threshold 3
    set admin-tls-v10 disable
    set admin-tls-v11 disable
    set multi-factor-authentication mandatory
    set pre-login-banner enable
    set ntpsync enable
    set ntpserver "192.168.100.123"
end
config system settings
    set opmode reverse-proxy
end
config system password-policy
    set status enable
    set min-length-option enable
    set mini-length 14
    set character-requirements enable
    set forbid-password-reuse enable
end
config system admin
    edit "jdoe-admin"
        set access-profile "prof_admin"
        set trusthosts 192.168.100.0/24
        set password ENC AK1qX0EXAMPLEONLY
    next
end
config system interface
    edit "port1"
        set ip 10.10.10.5/24
        set allowaccess ping
        set status up
    next
    edit "port2"
        set ip 10.30.30.5/24
        set allowaccess ping
        set status up
    next
    edit "port3"
        set ip 192.168.100.5/24
        set allowaccess HTTPS ssh
        set status up
    next
end
config router static
    edit 1
        set dst 0.0.0.0/0
        set gateway 10.10.10.1
        set device "port1"
    next
end
config system ha
    set mode active-passive
    set group-id 7
    set hbdev "port4"
    set hbdev-backup "port5"
    set monitor "port1" "port2"
    set encryption enable
end
config system vip
    edit "www_vip"
        set vip 10.10.10.20/24
        set interface "port1"
    next
end
config server-policy vserver
    edit "www_vs"
        config vip-list
            edit 1
                set interface "port1"
                set vip "www_vip"
                set status enable
            next
        end
    next
end
config server-policy health
    edit "www-health"
        config health-list
            edit 1
                set type HTTP
                set url-path "/healthz"
                set method get
                set match-type response-code
                set response-code 200
            next
        end
    next
end
config server-policy server-pool
    edit "www_pool"
        set type reverse-proxy
        set server-balance enable
        set health "www-health"
        config pserver-list
            edit 1
                set ip 10.30.30.21
                set port 443
                set ssl enable
                set server-certificate-verify enable
                set tls-v10 disable
                set tls-v11 disable
                set tls-v13 enable
                set status enable
            next
            edit 2
                set ip 10.30.30.22
                set port 443
                set ssl enable
                set server-certificate-verify enable
                set tls-v10 disable
                set tls-v11 disable
                set tls-v13 enable
                set status enable
            next
        end
    next
end
config server-policy allow-hosts
    edit "www-hosts"
        set default-action deny
        config host-list
            edit 1
                set host "www.example.com"
            next
        end
    next
end
