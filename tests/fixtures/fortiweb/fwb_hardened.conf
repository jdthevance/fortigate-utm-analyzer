config waf signature
    edit "www-signatures"
        config main_class_list
            edit "010000000"
                set action alert_deny
                set severity High
            next
            edit "030000000"
                set action alert_deny
                set severity High
            next
            edit "050000000"
                set action alert_deny
                set severity High
            next
            edit "070000000"
                set action alert_deny
                set severity High
            next
            edit "080000000"
                set action alert_erase
            next
            edit "090000000"
                set action alert_deny
                set severity High
            next
            edit "100000000"
                set action alert_erase
            next
        end
    next
end
config waf HTTP-protocol-parameter-restriction
    edit "www-constraints"
        set max-HTTP-header-length-check enable
        set max-HTTP-header-length-action alert_deny
        set Illegal-HTTP-request-method-check enable
        set Illegal-HTTP-request-method-action alert_deny
    next
end
config waf HTTP-request-flood-prevention-rule
    edit "www-flood"
        set access-limit-in-HTTP-session 300
        set action block-period
        set block-period 300
    next
end
config waf application-layer-dos-prevention
    edit "www-dos"
        set enable-HTTP-session-based-prevention enable
        set HTTP-request-flood-prevention-rule "www-flood"
    next
end
config waf known-bots
    edit "www-known-bots"
        set scanner-status enable
        set scanner-action alert_deny
        set trojan-status enable
        set trojan-action alert_deny
    next
end
config waf bot-mitigate-policy
    edit "www-bots"
        set known-bots "www-known-bots"
    next
end
config waf allow-method-policy
    edit "www-methods"
        set allow-method get post head
    next
end
config waf cookie-security
    edit "www-cookies"
        set security-mode signed
        set action alert_deny
        set secure-cookie enable
        set HTTP-only enable
    next
end
config waf http-header-security
    edit "www-headers"
        config HTTP-header-security-list
            edit 1
                set name x-frame-options
                set value sameorigin
            next
            edit 2
                set name x-content-type-options
                set value nosniff
            next
            edit 3
                set name content-security-policy
            next
        end
    next
end
config waf file-upload-restriction-policy
    edit "www-uploads"
        set action alert_deny
        set av-scan enable
        set trojan-detection enable
    next
end
config waf syntax-based-attack-detection
    edit "www-syntax"
        set sql-arithmetic-operation-status enable
        set sql-arithmetic-operation-action alert_deny
    next
end
config waf web-protection-profile inline-protection
    edit "www-profile"
        set signature-rule "www-signatures"
        set HTTP-protocol-parameter-restriction "www-constraints"
        set application-layer-dos-prevention "www-dos"
        set bot-mitigate-policy "www-bots"
        set allow-method-policy "www-methods"
        set cookie-security-policy "www-cookies"
        set HTTP-header-security "www-headers"
        set file-upload-policy "www-uploads"
        set syntax-based-attack-detection "www-syntax"
        set ip-intelligence enable
    next
end
config waf machine-learning-policy
    edit 1
        set status enable
        set action-anomaly alert_deny
        config allow-domain-name
            edit 1
                set domain-name "www.example.com"
            next
        end
    next
end
config server-policy policy
    edit "www-https"
        set deployment-mode server-pool
        set vserver "www_vs"
        set server-pool "www_pool"
        set service HTTP
        set HTTPS-service HTTPS
        set HTTP-to-HTTPS enable
        set web-protection-profile "www-profile"
        set allow-hosts "www-hosts"
        set certificate "www-cert"
        set tls-v10 disable
        set tls-v11 disable
        set tls-v12 enable
        set tls-v13 enable
        set ssl-cipher high
        set hsts-header enable
        set hsts-max-age 31536000
        set internal-cookie-secure enable
        set internal-cookie-HTTPonly enable
        set syncookie enable
        set tlog enable
        set status enable
    next
end
config log attack-log
    set status enable
end
config log traffic-log
    set status enable
end
config log fortianalyzer-policy
    edit "faz"
        config fortianalyzer-server-list
            edit 1
                set ip-address "192.168.100.50"
            next
        end
    next
end
config log forti-analyzer
    set status enable
    set fortianalyzer-policy "faz"
end
config system autoupdate schedule
    set status enable
    set frequency daily
end
config system backup
    edit "nightly"
        set config-type full-config
        set protocol-type sftp
        set encryption enable
        set ftp-server "192.168.100.70"
    next
end
