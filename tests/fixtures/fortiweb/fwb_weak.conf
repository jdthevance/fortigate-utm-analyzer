config waf signature
    edit "shop-signatures"
        config main_class_list
            edit "010000000"
                set action alert_deny
                set severity High
            next
            edit "030000000"
                set action alert_deny
                set severity High
            next
            edit "050000000"
                set action alert
            next
            edit "090000000"
                set action alert_deny
            next
        end
        config sub_class_disable_list
            edit "070000000"
            next
        end
        config signature_disable_list
            edit "050140001"
            next
            edit "030000182"
            next
        end
        config filter_list
            edit 1
                set signature_id "090240001"
                set match-target URI
                set value "/"
            next
        end
    next
end
config waf x-forwarded-for
    edit "xff-upstream"
        set x-forwarded-for-support enable
        set tracing-original-ip enable
        set original-ip-header X-FORWARDED-FOR
        set block-based-on-original-ip enable
    next
end
config waf ip-list
    edit "trusted-sources"
        set action alert_deny
        config members
            edit 1
                set type trust-ip
                set ip "10.10.10.1"
            next
            edit 2
                set type trust-ip
                set ip "10.0.0.0/8"
            next
        end
    next
end
config waf allow-method-policy
    edit "shop-methods"
        set allow-method get post head options trace
    next
end
config waf HTTP-request-flood-prevention-rule
    edit "shop-flood"
        set access-limit-in-HTTP-session 200
        set action alert
    next
end
config waf application-layer-dos-prevention
    edit "shop-dos"
        set enable-HTTP-session-based-prevention enable
        set HTTP-request-flood-prevention-rule "shop-flood"
    next
end
config waf cookie-security
    edit "shop-cookies"
        set security-mode no
        set secure-cookie disable
    next
end
config waf file-upload-restriction-policy
    edit "shop-uploads"
        set action alert_deny
        set av-scan disable
        set trojan-detection disable
    next
end
config waf web-protection-profile inline-protection
    edit "shop-profile"
        set signature-rule "shop-signatures"
        set x-forwarded-for-rule "xff-upstream"
        set ip-list-policy "trusted-sources"
        set allow-method-policy "shop-methods"
        set application-layer-dos-prevention "shop-dos"
        set cookie-security-policy "shop-cookies"
        set file-upload-policy "shop-uploads"
        set ip-intelligence enable
        set fortigate-quarantined-ips enable
    next
    edit "portal-profile"
        set signature-rule "Alert Only"
    next
end
config server-policy policy
    edit "shop-https"
        set deployment-mode server-pool
        set vserver "shop_vs"
        set server-pool "shop_pool"
        set service HTTP
        set HTTPS-service HTTPS
        set web-protection-profile "shop-profile"
        set certificate "shop-cert"
        set status enable
    next
    edit "portal-http"
        set deployment-mode server-pool
        set vserver "portal_vs"
        set server-pool "portal_pool"
        set HTTPS-service HTTPS
        set certificate "portal-legacy"
        set web-protection-profile "portal-profile"
        set monitor-mode enable
        set status enable
    next
    edit "legacy-api"
        set deployment-mode server-pool
        set vserver "portal_vs"
        set server-pool "portal_pool"
        set service HTTP
        set status enable
    next
end
config system fortigate-integration
    set server "10.10.10.1"
    set port 80
    set protocol HTTP
    set username "fwb-api"
    set password ENC EXAMPLEONLY
    set flag enable
end
config log attack-log
    set status enable
end
config log syslog-policy
    edit "siem"
        config syslog-server-list
            edit 1
                set server "192.168.100.60"
                set port 514
                set proto udp
            next
        end
    next
end
config log syslogd
    set status enable
    set policy "siem"
end
config system autoupdate schedule
    set status enable
    set frequency weekly
end
config user ldap-user
    edit "corp-ad"
        set server "10.1.0.20"
        set port 389
        set bind-type regular
    next
end
config system backup
    edit "nightly"
        set config-type full-config
        set protocol-type ftp
        set ftp-server "192.168.100.70"
    next
end
