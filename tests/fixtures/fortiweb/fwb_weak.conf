#config-version=FVVM00-8.00-FW-build0123-250101:opmode=0:vdom=0
#Sample FortiWeb 8.0 configuration for tests. Built from the FortiWeb 8.0 CLI
#Reference; it is not a real customer backup. It deliberately contains common
#mistakes, see docs/FORTIWEB_AUDIT.md.
config system global
    set hostname "FWB-DMZ-01"
    set admintimeout 60
    set admin-lockout-threshold 8
    set admin-tls-v11 enable
    set multi-factor-authentication optional
    set shell-access enable
    set ntpsync disable
end
config system settings
    set opmode reverse-proxy
end
config system admin
    edit "admin"
        set access-profile "prof_admin"
        set password ENC AK1qX0EXAMPLEONLY
    next
    edit "webops"
        set access-profile "prof_admin"
        set trusthosts 0.0.0.0/0
        set password ENC AK1qX0EXAMPLEONLY
    next
    edit "auditor"
        set access-profile "read_only"
        set trusthost1 10.0.0.0 255.0.0.0
        set password ENC AK1qX0EXAMPLEONLY
    next
end
config system interface
    edit "port1"
        set ip 10.10.10.5/24
        set allowaccess ping HTTPS ssh HTTP
        set status up
    next
    edit "port2"
        set ip 10.20.20.5/24
        set allowaccess ping
        set status up
    next
    edit "port3"
        set ip 192.168.100.5/24
        set allowaccess HTTPS ssh snmp
        set status up
    next
end
config router static
    edit 1
        set dst 0.0.0.0/0
        set gateway 10.10.10.254
        set device "port1"
    next
end
config system snmp community
    edit 1
        set name "public"
        set status enable
        set query-v1-status enable
    next
end
config system vip
    edit "shop_vip"
        set vip 10.10.10.10/24
        set interface "port1"
    next
    edit "portal_vip"
        set vip 10.10.10.11/24
        set interface "port1"
    next
end
config server-policy vserver
    edit "shop_vs"
        config vip-list
            edit 1
                set interface "port1"
                set vip "shop_vip"
                set status enable
            next
        end
    next
    edit "portal_vs"
        config vip-list
            edit 1
                set interface "port1"
                set vip "portal_vip"
                set status enable
            next
        end
    next
end
config server-policy server-pool
    edit "shop_pool"
        set type reverse-proxy
        set server-balance enable
        config pserver-list
            edit 1
                set ip 10.20.20.21
                set port 443
                set ssl enable
                set status enable
            next
            edit 2
                set ip 10.20.20.22
                set port 443
                set ssl enable
                set status enable
            next
        end
    next
    edit "portal_pool"
        set type reverse-proxy
        config pserver-list
            edit 1
                set ip 10.20.20.31
                set port 80
                set status enable
            next
        end
    next
end
