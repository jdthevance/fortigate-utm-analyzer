#config-version=FGT100F-7.4.5-FW-build2702-240909:opmode=0:vdom=0
#Sample hardened FortiGate configuration in front of fwb_hardened.conf. Not a real backup.
config system interface
    edit "wan1"
        set ip 203.0.113.2 255.255.255.0
        set role wan
    next
    edit "waf-dmz"
        set ip 10.10.10.1 255.255.255.0
        set allowaccess ping
        set role dmz
    next
    edit "internal"
        set ip 10.1.0.1 255.255.0.0
        set role lan
    next
    edit "mgmt"
        set ip 192.168.100.1 255.255.255.0
        set allowaccess ping https ssh
    next
end
config router static
    edit 1
        set gateway 203.0.113.1
        set device "wan1"
    next
end
config system ntp
    set ntpsync enable
    set type fortiguard
end
config log fortianalyzer setting
    set status enable
    set server "192.168.100.50"
end
config firewall address
    edit "all"
        set subnet 0.0.0.0 0.0.0.0
    next
    edit "LAN"
        set subnet 10.1.0.0 255.255.0.0
    next
end
config firewall vip
    edit "VIP-WWW-HTTPS"
        set extip 203.0.113.20
        set extintf "wan1"
        set portforward enable
        set extport 443
        set mappedport 443
        set mappedip "10.10.10.20"
    next
    edit "VIP-WWW-HTTP"
        set extip 203.0.113.20
        set extintf "wan1"
        set portforward enable
        set extport 80
        set mappedport 80
        set mappedip "10.10.10.20"
    next
end
config firewall policy
    edit 10
        set name "WWW via FortiWeb"
        set srcintf "wan1"
        set dstintf "waf-dmz"
        set srcaddr "all"
        set dstaddr "VIP-WWW-HTTPS" "VIP-WWW-HTTP"
        set action accept
        set schedule "always"
        set service "HTTPS" "HTTP"
        set ips-sensor "protect_http_server"
        set logtraffic all
    next
    edit 20
        set name "Staff to WWW via FortiWeb"
        set srcintf "internal"
        set dstintf "waf-dmz"
        set srcaddr "LAN"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
    next
end
