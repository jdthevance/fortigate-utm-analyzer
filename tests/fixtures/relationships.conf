#config-version=FGT60F-7.4.3-FW-build2573:opmode=0:vdom=0
config system interface
    edit "wan1"
        set ip 203.0.113.2 255.255.255.0
        set role wan
    next
    edit "internal"
        set ip 10.1.0.1 255.255.0.0
        set role lan
    next
    edit "servers"
        set ip 10.20.0.1 255.255.255.0
        set role lan
    next
    edit "Guest-WiFi"
        set ip 172.30.0.1 255.255.255.0
    next
end
config system zone
    edit "LAN-Zone"
        set interface "internal" "servers"
    next
end
config router static
    edit 1
        set gateway 203.0.113.1
        set device "wan1"
    next
end
config firewall address
    edit "all"
        set subnet 0.0.0.0 0.0.0.0
    next
    edit "LAN"
        set subnet 10.1.0.0 255.255.0.0
    next
    edit "Critical-Servers"
        set subnet 10.20.0.0 255.255.255.0
    next
    edit "Internal-Network"
        set subnet 10.0.0.0 255.0.0.0
    next
    edit "Guest-Net"
        set subnet 172.30.0.0 255.255.255.0
    next
    edit "Everything-Internal"
        set subnet 0.0.0.0 0.0.0.0
    next
    edit "App1"
        set subnet 10.20.0.10 255.255.255.255
    next
    edit "App2"
        set subnet 10.20.0.11 255.255.255.255
    next
end
config firewall addrgrp
    edit "App-Servers"
        set member "App1" "App2"
    next
end
config firewall service custom
    edit "HTTPS"
        set tcp-portrange 443
    next
    edit "ALL"
        set protocol IP
    next
    edit "RDP"
        set tcp-portrange 3389
    next
end
config firewall policy
    edit 10
        set name "LAN-any"
        set srcintf "internal"
        set dstintf "servers"
        set action accept
        set srcaddr "LAN"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 20
        set name "LAN-critical-https"
        set srcintf "internal"
        set dstintf "servers"
        set action accept
        set srcaddr "LAN"
        set dstaddr "Critical-Servers"
        set schedule "always"
        set service "HTTPS"
        set utm-status enable
        set ips-sensor "default"
        set logtraffic all
    next
    edit 30
        set name "Guest-to-internal"
        set srcintf "Guest-WiFi"
        set dstintf "LAN-Zone"
        set action accept
        set srcaddr "Guest-Net"
        set dstaddr "Internal-Network"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 40
        set name "block-rdp-to-apps"
        set srcintf "internal"
        set dstintf "servers"
        set action deny
        set srcaddr "LAN"
        set dstaddr "App-Servers"
        set schedule "always"
        set service "RDP"
        set logtraffic all
    next
    edit 50
        set name "dup-of-20"
        set srcintf "internal"
        set dstintf "servers"
        set action accept
        set srcaddr "LAN"
        set dstaddr "Critical-Servers"
        set schedule "always"
        set service "HTTPS"
        set utm-status enable
        set ips-sensor "default"
        set logtraffic all
    next
    edit 60
        set name "internet"
        set srcintf "internal"
        set dstintf "wan1"
        set action accept
        set srcaddr "Everything-Internal"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic disable
    next
end
config log setting
    set fwpolicy-implicit-log disable
end
