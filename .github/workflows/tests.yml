name: Offline analyzer tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.8 builds are not published for the newest Ubuntu image,
          # so the oldest supported Python runs on an older runner image.
          - python: '3.8'
            os: ubuntu-22.04
          - python: '3.11'
            os: ubuntu-latest
          - python: '3.14'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m py_compile utm.py
      - run: python utm.py --help
      - run: python -m policyaudit --help
      - run: python fwb.py --help
      - run: python -m fwbaudit --help
      - run: python -m unittest discover -s tests -v
